<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biaya Pengeluaran</title>
  
  <link rel="stylesheet" href="../../CSS/style.css">
  <link rel="stylesheet" href="../../CSS/artikel10.css">
  <link rel="stylesheet" href="/CSS/menu.css">
  <link rel="stylesheet" href="/CSS/responsive.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body onload="init()">

  <header>
    <div class="title-section">
      <h1>Biaya Pengeluaran</h1>
    </div>
    <nav id="menu"></nav>
  </header>

  <main class="wrapper">
    <section class="form-container">
      <h2>Pilih Jenis Pengeluaran</h2>

      <div class="form-group">
        <label for="jenis">Jenis</label>
        <select id="jenis" onchange="updateKategori()">
          <option value="Harian">🕒 Harian</option>
          <option value="Bulanan">📅 Bulanan</option>
        </select>
      </div>

      <div class="form-group">
        <label for="kategori">Kategori</label>
        <select id="kategori" onchange="updateSubKategori()"></select>
        <input type="text" id="kategoriCustom" placeholder="Isi kategori sendiri..." style="display:none;">
      </div>

      <div class="form-group">
        <label for="subKategori">Sub-Kategori</label>
        <select id="subKategori"></select>
        <input type="text" id="subKategoriCustom" placeholder="Isi sub-kategori sendiri..." style="display:none;">
      </div>

      <div class="form-group">
        <label for="nominal">Jumlah Pengeluaran (Rp)</label>
        <input type="text" id="nominal" inputmode="numeric" placeholder="Masukkan nominal..." oninput="formatNominal(this)">
      </div>

      <button type="button" onclick="tambahTransaksi()">+ Tambah Transaksi</button>
    </section>

    <aside id="kontainerStruk" style="display: none;">
      <div id="areaStruk" class="struk-box">
        <div class="struk-title">NOTA PEMBUKUAN</div>
        <div class="struk-subtitle">Dicatat via Sistem Web</div>
        <div class="struk-row"><span>Tanggal:</span><span id="txtTanggal">-</span></div>
        <div class="struk-row"><span>Jam:</span><span id="txtJam">-</span></div>
        <div class="divider"></div>
        
        <div class="transaksi-list"></div>
        
        <div class="struk-total"><span>TOTAL PENGELUARAN:</span><span id="txtTotal">Rp 0</span></div>
        <div class="struk-footer">*** Terima Kasih ***<br>Simpan Struk Ini Sebagai Bukti</div>
      </div>
      <button class="btn-share" onclick="bagikanKeWhatsApp()">🔗 Bagikan ke WhatsApp</button>
    </aside>

    <section class="form-container">
      <h2>Daftar Transaksi</h2>
      <div id="transaksiList"></div>
      <button type="button" id="btnSheets" onclick="simpanKeGoogleSheets()">💾 Simpan ke Google Sheets</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Biaya Pengeluaran</p>
  </footer>

  <script src="/js/artikel10.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
