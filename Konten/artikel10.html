<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biaya Pengeluaran</title>
  <link rel="stylesheet" href="../../CSS/style.css">
  <link rel="stylesheet" href="../../CSS/artikel10.css">
  <link rel="stylesheet" href="../CSS/menu.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <header>
    <div class="title-section">
      <h1>Biaya Pengeluaran</h1>
    </div>
    <div id="menu"></div>
  </header>

  <main class="wrapper">
    <!-- Form Input -->
     
    <section class="form-container">
      <h2>Pilih Jenis Pengeluaran</h2>
      <div class="form-group">
        <label>Jenis</label>
        <select id="jenis" onchange="updateKategori()">
          <option value="Harian">🕒 Harian</option>
          <option value="Bulanan">📅 Bulanan</option>
        </select>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="kategori" onchange="updateSubKategori()"></select>
        <!-- input kategori custom -->
        <input type="text" id="kategoriCustom" placeholder="Isi kategori sendiri..." style="display:none;" oninput="perbaruiStruk()">
      </div>
      <div class="form-group">
        <label>Sub-Kategori</label>
        <select id="subKategori" onchange="perbaruiStruk()"></select>
        <!-- input sub-kategori custom -->
        <input type="text" id="subKategoriCustom" placeholder="Isi sub-kategori sendiri..." style="display:none;" oninput="perbaruiStruk()">
      </div>
      <div class="form-group">
        <label>Jumlah Pengeluaran (Rp)</label>
        <input type="text" id="nominal" placeholder="Masukkan nominal..." oninput="formatNominal(this)">

      </div>
    </section>

    <!-- Preview Struk -->
    <aside>
      <div id="areaStruk" class="struk-box">
        <div class="struk-title">NOTA PEMBUKUAN</div>
        <div class="struk-subtitle">Dicatat via Sistem Web</div>
        <div class="struk-row"><span>Tanggal:</span><span id="txtTanggal"></span></div>
        <div class="struk-row"><span>Jam:</span><span id="txtJam"></span></div>
        <div class="divider"></div>
        <div class="struk-row"><span id="txtJenis"></span></div>
        <div class="struk-row"><span id="txtKategori"></span></div>
        <div class="struk-row sub-row">
          <span id="txtSub"></span><span id="txtNominal"></span>
        </div>
        <div class="divider"></div>
        <div class="struk-total"><span>TOTAL PENGELUARAN:</span><span id="txtTotal"></span></div>
        <div class="struk-footer">*** Terima Kasih ***<br>Simpan Struk Ini Sebagai Bukti</div>
      </div>
      <button class="btn-share" onclick="bagikanKeWhatsApp()">🔗 Bagikan ke WhatsApp</button>
    </aside>
    <section class="form-container">
  <!-- ... form input seperti biasa ... -->
  <button type="button" onclick="tambahTransaksi()">+ Tambah Transaksi</button>
</section>

<!-- Daftar transaksi -->
<section class="form-container">
  <h2>Daftar Transaksi</h2>
  <div id="transaksiList"></div>
</section>

  </main>

  <footer>
    <p>&copy; 2026 Biaya Pengeluaran</p>
  </footer>

  <script src="/js/artikel10.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
